 <div class="student-card"
  *ngFor="let student of students; let i = index"
  [class.active]="student.isActive"
>
    <h3>{{ i + 1 }}. {{ student.firstName }} 
        {{ student.middleName }} 
        {{ student.lastName }}</h3>
    <p>{{ student.Course }}</p>
    <p class="year-level">Year: {{ student.YearLevel }}</p>

    <div class="student-actions">
        <button class="favorite-btn"
        [class.favorited]="student.isFavorited"
        (click)="student.isFavorited = !student.isFavorited"
        >{{ student.isFavorited ? '★ Favorited' : 'Favorite' }}</button>


        <button class="edit-btn"(click)="editStudent(student)">Edit</button>
        <button class="delete-btn"
        (click)="deleteStudent(i)">Delete</button>
    </div> 

    

</div>
